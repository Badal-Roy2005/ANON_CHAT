services:
  - type: web
    name: anon-chat-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: CLIENT_ORIGIN
        sync: false